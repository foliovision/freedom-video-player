
<!doctype html>
<html>
<head>

   <!-- player skin -->
   <link rel="stylesheet" type="text/css" href="../dist/skin/skin.css?f" />
   <link rel="stylesheet" href="http://demos.flowplayer.org/media/css/playlist.css" />

   <!-- site specific styling -->
   <style>
   body {
      font: 12px "Myriad Pro", "Lucida Grande", sans-serif;
      text-align: center;
      padding-top: 1%;
   }
   .freedomplayer { width: 70%; }
   </style>

   <!-- include freedomplayer -->
   <script src="../dist/freedomplayer.js?i"></script>
   </head>

<body>

   <!-- the player -->
   <div id="player">
    </div>

    <script>
    var el = document.getElementById('player');
    var api = freedomplayer(el, {
        splash: false,
        enginePreference: ['html5'],
        debug: true,
        ratio: 0.417,
        adaptiveRatio: true,
        playlist: [{
          preload: "none",
          sources: [
            {
              type: "video/webm",
              src: "http://edge.flowplayer.org/bauhaus/624x260.webm"
            },
            {
              type: "video/mp4",
              src: "http://edge.flowplayer.org/bauhaus/624x260.mp4"
            }
          ]
        }, {
          preload: "none",
          sources: [
            {
              type: "application/x-mpegurl",
              src: "http://edge.flowplayer.org/functional.m3u8"
            }
          ]
        }, {
          preload: "none",
          sources: [
            {
              type: "video/webm",
              src: "http://edge.flowplayer.org/night4.webm"
            },
            {
              type: "video/mp4",
              src: "http://edge.flowplayer.org/night4.mp4"
            }
          ]
        }]
      });
    </script>


</body>
