<head>

   <link rel="stylesheet" type="text/css" href="../dist/skin/skin.css" />

   <script src="//ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
   <script src="../dist/freedomplayer.js"></script>

   <style>
   body { font: 12px "Lucida Grande",sans-serif; }
   .freedomplayer { width: 620px; height: 350px; background-color: #444; margin: 50px auto;  }
   .video-quality { position: absolute; top: -20px; right: 10px;}
   .video-quality a { margin: 0 10px;}
   .video-quality .active { font-weight: bold;}
   </style>

   <script>
   $(function() {
      $(".player").freedomplayer();
   });
   </script>
</head>

<body>

   <div class="player" data-qualities="lo,med,hi">
      <video>
         <source type="video/mp4"  src="http://video.flowplayer.org/bbb.med.mp4"></source>
         <source type="video/ogg"  src="http://video.flowplayer.org/bbb.med.ogg"></source>
         <source type="video/webm" src="http://video.flowplayer.org/bbb.med.webm"></source>
      </video>
   </div>

</body>
